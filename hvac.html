<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nordic Homes — HVAC Tests</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;min-height:100vh;color:#1a1a2e;}

/* TOP BAR */
.topbar{background:linear-gradient(135deg,#1a3a2a 0%,#2d5a3d 100%);color:#fff;padding:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.topbar-inner{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:0.5px;}
.topbar-sub{font-size:11px;opacity:0.7;}
.topbar-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
select.top-sel{padding:6px 10px;border-radius:7px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.12);color:#fff;font-size:13px;cursor:pointer;}
select.top-sel option{background:#1a3a2a;color:#fff;}
.btn-connect{padding:6px 14px;border-radius:7px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:13px;cursor:pointer;font-weight:600;}
.btn-connect:hover{background:rgba(255,255,255,0.2);}
.btn-connect.connected{background:rgba(80,200,120,0.25);border-color:rgba(80,200,120,0.5);}

/* STATUS BAR */
.statusbar{background:#1a3a2a;color:rgba(255,255,255,0.75);font-size:11px;padding:4px 16px;min-height:22px;}

/* NAV TABS */
.nav-tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;padding:0 16px;}
.nav-tab{padding:12px 20px;font-size:13px;font-weight:600;color:#666;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;}
.nav-tab.active{color:#2d5a3d;border-bottom-color:#2d5a3d;}
.nav-tab:hover{color:#2d5a3d;}

/* MAIN CONTENT */
.main{padding:16px;max-width:1200px;margin:0 auto;}

/* OVERVIEW MATRIX */
.matrix-wrap{overflow-x:auto;}
.matrix-table{border-collapse:collapse;min-width:700px;width:100%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.matrix-table th{background:#2d5a3d;color:#fff;padding:10px 12px;font-size:12px;text-align:center;white-space:nowrap;}
.matrix-table th.mod-col{text-align:left;min-width:90px;}
.matrix-table td{padding:8px 10px;font-size:12px;text-align:center;border-bottom:1px solid #f0f0f0;border-right:1px solid #f0f0f0;}
.matrix-table td.mod-name{text-align:left;font-weight:600;color:#1a3a2a;background:#f8fdf9;}
.matrix-table tr:hover td{background:#f0f8f2;}
.matrix-table tr:hover td.mod-name{background:#e8f5ec;}
.cell-done{color:#2d5a3d;font-weight:600;cursor:pointer;}
.cell-done:hover{text-decoration:underline;}
.cell-empty{color:#bbb;}
.cell-na{color:#bbb;font-style:italic;}
.cell-btn{background:none;border:1px solid #2d5a3d;color:#2d5a3d;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap;}
.cell-btn-na{background:none;border:1px solid #bbb;color:#999;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap;margin-left:4px;}
.cell-btn-na:hover{background:#f5f5f5;color:#666;}
.cell-na-set{color:#aaa;font-style:italic;font-size:12px;cursor:pointer;}
.cell-na-set:hover{color:#666;}

/* GROUP HEADER ROW */
.matrix-table tr.group-row td{background:#e8f5ec;font-weight:700;font-size:12px;color:#1a3a2a;padding:6px 12px;letter-spacing:0.3px;}

/* TEST FORM */
.form-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:20px;margin-bottom:16px;}
.form-card h3{font-size:14px;font-weight:700;color:#2d5a3d;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e8f5ec;display:flex;align-items:center;gap:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/-1;}
.form-group label{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:0.3px;}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;background:#fafafa;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2d5a3d;background:#fff;}
.form-group textarea{resize:vertical;min-height:60px;}

/* MEASUREMENT SECTION */
.meas-table{width:100%;border-collapse:collapse;margin-top:8px;}
.meas-table th{background:#f0f8f2;color:#2d5a3d;font-size:11px;padding:7px 10px;text-align:center;border:1px solid #ddd;}
.meas-table th:first-child{text-align:left;}
.meas-table td{padding:6px 8px;border:1px solid #eee;text-align:center;}
.meas-table td:first-child{font-weight:600;font-size:12px;background:#fafafa;}
.meas-table input{width:100%;border:none;background:transparent;font-size:13px;text-align:center;padding:2px;}
.meas-table input:focus{outline:1px solid #2d5a3d;border-radius:4px;}
.diff-cell{font-weight:700;color:#2d5a3d;}
.diff-cell.fail{color:#c0392b;}

/* PHOTO SECTION */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px;}
.photo-slot{border:2px dashed #ccc;border-radius:8px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:#fafafa;transition:border-color 0.2s;}
.photo-slot:hover{border-color:#2d5a3d;background:#f0f8f2;}
.photo-slot img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
.photo-slot .photo-label{font-size:10px;color:#888;text-align:center;padding:4px;font-weight:600;}
.photo-slot .photo-label-overlay{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;padding:4px 6px;text-align:center;}
.photo-slot .remove-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;display:none;align-items:center;justify-content:center;}
.photo-slot:hover .remove-btn{display:flex;}
.uploading-overlay{position:absolute;inset:0;background:rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;font-size:12px;color:#2d5a3d;}

/* RESULT BAR */
.result-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-radius:10px;margin-top:8px;}
.result-bar.passed{background:#e8f5e9;border:2px solid #4caf50;}
.result-bar.failed{background:#ffebee;border:2px solid #f44336;}
.result-bar.pending{background:#f5f5f5;border:2px solid #ccc;}
.result-label{font-size:22px;font-weight:800;letter-spacing:1px;}
.result-bar.passed .result-label{color:#2e7d32;}
.result-bar.failed .result-label{color:#c62828;}
.result-bar.pending .result-label{color:#999;}

/* ACTION BUTTONS */
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.btn-primary{padding:10px 22px;background:#2d5a3d;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:#1a3a2a;}
.btn-secondary{padding:10px 22px;background:#fff;color:#2d5a3d;border:2px solid #2d5a3d;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-secondary:hover{background:#f0f8f2;}
.btn-pending{padding:10px 22px;background:#fff;color:#e65100;border:2px solid #e65100;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-pending:hover{background:#fff3e0;}
.btn-danger{padding:10px 22px;background:#fff;color:#c62828;border:2px solid #c62828;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn-danger:hover{background:#ffebee;}

/* VISUAL INSP */
.vi-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fdf9;border-radius:8px;border:1px solid #ddd;}
.vi-row input[type=checkbox]{width:18px;height:18px;accent-color:#2d5a3d;cursor:pointer;}
.vi-row label{font-size:13px;cursor:pointer;}

/* SECTION SUBTITLE */
.section-sub{font-size:11px;color:#888;font-style:italic;margin-bottom:8px;}

/* PIPE ROW LABEL */
.pipe-label{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;margin:10px 0 4px;}
.pipe-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

/* BACK LINK */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:#2d5a3d;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px;background:none;border:none;padding:0;}
.back-btn:hover{text-decoration:underline;}

/* RESPONSIVE */
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr;}
  .form-grid.cols3{grid-template-columns:1fr 1fr;}
  .topbar-controls{width:100%;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="topbar-title">🏠 Nordic Homes</div>
      <div class="topbar-sub">HVAC Pressure Tests</div>
    </div>
    <div class="topbar-controls">
      <select class="top-sel" id="project-sel" onchange="onProjectChange()">
        <option value="ISL_Holaborg">ISL Holaborg</option>
        <option value="ISL_Jorfi">ISL Jorfi</option>
        <option value="ISL_Mariuborg">ISL Mariuborg</option>
        <option value="GER_CS">GER CS Chimney Street</option>
      </select>
      <button class="btn-connect" id="connect-btn" onclick="handleConnect()">⬤ Connect OneDrive</button>

</div>
<div class="statusbar" id="statusbar">Not connected to OneDrive.</div>

<div class="nav-tabs">
  <div class="nav-tab active" id="tab-overview" onclick="showTab('overview')">📊 Overview</div>
  <div class="nav-tab" id="tab-test" onclick="showTab('test')" style="display:none" id="tab-test">📋 Test Form</div>
</div>

<div class="main">

  <!-- OVERVIEW TAB -->
  <div id="view-overview">
    <div class="matrix-wrap" id="matrix-wrap">
      <p style="color:#999;font-size:13px;padding:20px 0;">Connect OneDrive to load test data.</p>
    </div>
  </div>

  <!-- TEST FORM TAB -->
  <div id="view-test" style="display:none">
    <button class="back-btn" onclick="showTab('overview')">← Back to Overview</button>
    <div id="test-form-content"></div>
  </div>

</div>

<!-- Hidden file inputs -->
<input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhotoInput(event)"/>
<input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoInput(event)"/>

<script>
// ========== CONFIG ==========
const MS_CLIENT_ID='18090634-b157-4e0c-837d-590122ea9eca';
const MS_TENANT_ID='aac98fec-0701-4329-ad5d-8b1d279eeb6c';
const MS_SCOPES=['Files.ReadWrite','User.Read'];
const MS_REDIRECT_URI=window.location.origin+window.location.pathname;
const GRAPH_BASE='https://graph.microsoft.com/v1.0';

const PROJECTS={
  ISL_Holaborg:{label:'ISL Holaborg',folder:'ISL_Holaborg_QC',modules:['HLB 1-1','HLB 1-2','HLB 2','HLB 3-1','HLB 3-2','HLB 4','HLB 5-1','HLB 5-2']},
  ISL_Jorfi:{label:'ISL Jorfi',folder:'ISL_Jorfi_QC',modules:['JF 1-1','JF 1-2','JF 2','JF 3-1','JF 3-2']},
  ISL_Mariuborg:{label:'ISL Mariuborg',folder:'ISL_Mariuborg_QC',modules:['MB 1-1','MB 1-2','MB 2','MB 3-1','MB 3-2']},
  GER_CS:{label:'GER CS Chimney Street',folder:'GER_CS_QC',modules:['CS 2-1','CS 2-2','CS 2-3','CS 2-4','CS 2-5','CS 2-6','CS 2-7','CS 2-8']}
};

const TEST_TYPES={
  'QC-4.0':{label:'QC-4.0 Underfloor Heating Pneumatic',folder:'QC-4.0 Underfloor Heating Pneumatic',type:'heating'},
  'QC-4.1':{label:'QC-4.1 Radiator Heating Pneumatic',folder:'QC-4.1 Radiator Heating Pneumatic',type:'heating'},
  'QC-4.2':{label:'QC-4.2 Sewer Hydraulic',folder:'QC-4.2 Sewer Hydraulic',type:'sewer'},
  'QC-5.0':{label:'QC-5.0 Water Supply — Concealed Wall Piping',folder:'QC-5.0 Water Supply Concealed Wall Piping',type:'water'},
  'QC-5.1':{label:'QC-5.1 Water Supply — Collector Piping',folder:'QC-5.1 Water Supply Collector Piping',type:'water'},
  'QC-5.2':{label:'QC-5.2 Water Supply — Full System',folder:'QC-5.2 Water Supply Full System',type:'water'}
};

const PERFORMERS=['Edgars Rumbenieks','Edgars Kutovskis','Andrejs Bekčevs','Kristians Vēveris-Bajinskis'];
const QC_REP='Mārtiņš Danilevičs';
const ADMIN_EMAIL='martins.danilevics@nordichomes.lv';
let currentUserEmail='';
function isAdmin(){return currentUserEmail===ADMIN_EMAIL;}

// Scope defaults by test type
function currentScopeDefault(){
  const defaults={'QC-5.0':'Concealed Wall Piping','QC-5.1':'Collector Piping','QC-5.2':'Full System with Water Mixers'};
  return defaults[currentTestCtx?.testType]||'';
}

// ========== STATE ==========
let msToken=null;
let msTokenExpiry=0;
let msConnected=false;
let rootFolderId=null;
let currentProject='ISL_Holaborg';
let folderCache={};  // key: path string → id
// testsData[project][module][testKey] = {date, result, fileId, data}
let testsData={};
let currentTestCtx=null; // {module, testType, scope, data}
let currentPhotoSlot=null;

// ========== HELPERS ==========
function setStatus(msg){document.getElementById('statusbar').textContent=msg;}
function proj(){return PROJECTS[currentProject];}
function today(){return new Date().toLocaleDateString('de-DE');}
function todayISO(){return new Date().toISOString().slice(0,10);}

// ========== TABS ==========
function showTab(tab){
  document.getElementById('view-overview').style.display=tab==='overview'?'':'none';
  document.getElementById('view-test').style.display=tab==='test'?'':'none';
  document.getElementById('tab-overview').classList.toggle('active',tab==='overview');
  document.getElementById('tab-test').classList.toggle('active',tab==='test');
  document.getElementById('tab-test').style.display=tab==='test'?'':'none';
  if(tab==='overview')renderMatrix();
}

// ========== PROJECT CHANGE ==========
function onProjectChange(){
  currentProject=document.getElementById('project-sel').value;
  folderCache={};
  showTab('overview');
  if(msConnected)loadProjectTests();
}

// Manual refresh button
async function forceRefresh(){
  clearCache();
  loadingTests=false;
  await loadProjectTests();
}

// ========== AUTH (PKCE — same as QC3) ==========
async function generateCodeVerifier(){
  const arr=new Uint8Array(32);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function generateCodeChallenge(verifier){
  const data=new TextEncoder().encode(verifier);
  const digest=await crypto.subtle.digest('SHA-256',data);
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function handleConnect(){
  if(msConnected){setStatus('Already connected.');return;}
  // Try silent restore first
  const expiry=parseInt(localStorage.getItem('hvac_ms_token_expiry')||'0');
  const rt=localStorage.getItem('hvac_ms_refresh_token');
  if(rt&&Date.now()<expiry-30000){
    msConnected=true;updateConnectBtn();
    setStatus('Restoring OneDrive connection...');
    await setupFoldersAndLoad();return;
  }
  if(rt){
    try{const d=await refreshMsToken();saveMsTokens(d);msConnected=true;updateConnectBtn();await setupFoldersAndLoad();return;}
    catch(e){localStorage.removeItem('hvac_ms_refresh_token');}
  }
  // PKCE login
  const verifier=await generateCodeVerifier();
  const challenge=await generateCodeChallenge(verifier);
  sessionStorage.setItem('hvac_pkce_verifier',verifier);
  const params=new URLSearchParams({
    client_id:MS_CLIENT_ID,
    response_type:'code',
    redirect_uri:MS_REDIRECT_URI,
    scope:MS_SCOPES.join(' ')+' offline_access',
    code_challenge:challenge,
    code_challenge_method:'S256',
    response_mode:'query'
  });
  window.location.href=`https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/authorize?${params}`;
}

async function exchangeMsCode(code){
  const verifier=sessionStorage.getItem('hvac_pkce_verifier');
  if(!verifier)throw new Error('No PKCE verifier');
  const body=new URLSearchParams({
    client_id:MS_CLIENT_ID,
    grant_type:'authorization_code',
    code,
    redirect_uri:MS_REDIRECT_URI,
    code_verifier:verifier,
    scope:MS_SCOPES.join(' ')+' offline_access'
  });
  const res=await fetch(`https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token`,{method:'POST',body,headers:{'Content-Type':'application/x-www-form-urlencoded'}});
  const data=await res.json();
  if(data.error)throw new Error(data.error_description||data.error);
  return data;
}

async function refreshMsToken(){
  const rt=localStorage.getItem('hvac_ms_refresh_token');
  if(!rt)throw new Error('No refresh token');
  const body=new URLSearchParams({
    client_id:MS_CLIENT_ID,
    grant_type:'refresh_token',
    refresh_token:rt,
    scope:MS_SCOPES.join(' ')+' offline_access'
  });
  const res=await fetch(`https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token`,{method:'POST',body,headers:{'Content-Type':'application/x-www-form-urlencoded'}});
  const data=await res.json();
  if(data.error)throw new Error(data.error_description||data.error);
  return data;
}

function saveMsTokens(data){
  msToken=data.access_token;
  msTokenExpiry=Date.now()+(data.expires_in-300)*1000;
  localStorage.setItem('hvac_ms_token_expiry',String(msTokenExpiry));
  if(data.refresh_token)localStorage.setItem('hvac_ms_refresh_token',data.refresh_token);
}

async function ensureToken(){
  if(msToken&&Date.now()<msTokenExpiry)return msToken;
  const data=await refreshMsToken();
  saveMsTokens(data);
  return msToken;
}

async function graphRequest(path,options={}){
  const token=await ensureToken();
  const res=await fetch(GRAPH_BASE+path,{
    ...options,
    headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})}
  });
  if(!res.ok){
    const err=await res.text();
    throw new Error(`Graph ${res.status}: ${err}`);
  }
  if(res.status===204)return{};
  const ct=res.headers.get('content-type')||'';
  if(ct.includes('json'))return res.json();
  // Return raw text for file content downloads
  return res.text();
}

function updateConnectBtn(){
  const btn=document.getElementById('connect-btn');
  btn.textContent=msConnected?'✓ OneDrive connected':'⬤ Connect OneDrive';
  btn.classList.toggle('connected',msConnected);
}

// ========== INIT (handle OAuth redirect — PKCE) ==========
(async()=>{
  const url=new URL(window.location.href);
  const code=url.searchParams.get('code');
  if(code){
    url.searchParams.delete('code');
    url.searchParams.delete('state');
    window.history.replaceState({},'',url.toString());
    setStatus('Connecting to OneDrive...');
    try{
      const data=await exchangeMsCode(code);
      saveMsTokens(data);
      sessionStorage.removeItem('hvac_pkce_verifier');
      msConnected=true;
      updateConnectBtn();
      await setupFoldersAndLoad();
    }catch(e){setStatus('Auth error: '+e.message);}
    return;
  }
  // Try silent restore
  const rt=localStorage.getItem('hvac_ms_refresh_token');
  const expiry=parseInt(localStorage.getItem('hvac_ms_token_expiry')||'0');
  if(rt){
    try{
      const data=await refreshMsToken();
      saveMsTokens(data);
      msConnected=true;
      updateConnectBtn();
      setStatus('Restoring session...');
      await setupFoldersAndLoad();
      return;
    }catch(e){
      localStorage.removeItem('hvac_ms_refresh_token');
      setStatus('Please connect OneDrive.');
    }
  }
  renderMatrix();
})();

// ========== FOLDER MANAGEMENT ==========
async function ensureFolder(parentId,name){
  const cacheKey=parentId+'/'+name;
  if(folderCache[cacheKey])return folderCache[cacheKey];
  const search=await graphRequest(`/me/drive/items/${parentId}/children?$filter=name eq '${encodeURIComponent(name)}'&$select=id,name,webUrl`);
  const existing=(search.value||[]).find(f=>f.name===name);
  if(existing){folderCache[cacheKey]=existing;return existing;}
  const created=await graphRequest(`/me/drive/items/${parentId}/children`,{
    method:'POST',
    body:JSON.stringify({name,folder:{},['@microsoft.graph.conflictBehavior']:'rename'})
  });
  folderCache[cacheKey]=created;
  return created;
}

async function setupFoldersAndLoad(){
  setStatus('Setting up OneDrive...');
  try{
    folderCache={};
    const root=await ensureFolder('root','Nordic_QC3');
    rootFolderId=root.id;
    // Fetch user identity
    try{
      const me=await graphRequest('/me?$select=mail,userPrincipalName');
      currentUserEmail=(me.mail||me.userPrincipalName||'').toLowerCase();
    }catch(e){currentUserEmail='';}
    updateRoleUI();
    startAutoRefresh();
    await loadProjectTests();
  }catch(e){setStatus('OneDrive error: '+e.message);console.error(e);}
}

function updateRoleUI(){
  const roleLabel=isAdmin()?'👑 Admin':'👷 Technician';
  document.getElementById('connect-btn').title=currentUserEmail+' — '+roleLabel;
}

// Auto-refresh every 2 min when tab is visible
let autoRefreshTimer=null;
function startAutoRefresh(){
  if(autoRefreshTimer)clearInterval(autoRefreshTimer);
  autoRefreshTimer=setInterval(()=>{
    if(!document.hidden&&msConnected&&!loadingTests){
      loadingTests=false; // reset lock
      loadProjectTests();
    }
  },120000); // every 2 min
}
// Refresh immediately when tab becomes visible again
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&msConnected&&!loadingTests){
    loadingTests=false;
    loadProjectTests();
  }
});

async function getModuleHVACFolder(modName,testTypeKey){
  const projFolder=await ensureFolder(rootFolderId,proj().folder);
  const modFolder=await ensureFolder(projFolder.id,modName);
  const hvacRoot=await ensureFolder(modFolder.id,`${modName} HVAC Tests`);
  const testFolder=await ensureFolder(hvacRoot.id,TEST_TYPES[testTypeKey].folder);
  return testFolder;
}

// ========== LOAD ALL TESTS FOR PROJECT ==========
let loadingTests=false;
// ── CACHE HELPERS ────────────────────────────────────────────────────────────
function cacheKey(){return `hvac_tests_${currentProject}`;}

function saveToCache(){
  try{
    const payload={ts:Date.now(),data:testsData[currentProject]};
    localStorage.setItem(cacheKey(),JSON.stringify(payload));
  }catch(e){console.warn('Cache write error',e);}
}

function loadFromCache(){
  try{
    const raw=localStorage.getItem(cacheKey());
    if(!raw)return false;
    const payload=JSON.parse(raw);
    // Use cache up to 10 min old
    if(Date.now()-payload.ts>120000)return false; // 2 min TTL
    testsData[currentProject]=payload.data||{};
    return true;
  }catch(e){return false;}
}

function clearCache(proj){
  try{localStorage.removeItem(`hvac_tests_${proj||currentProject}`);}catch(e){}
}

// ── FAST LOAD: search for all JSON files under project folder in one call ─────
async function loadProjectTests(){
  if(!rootFolderId)return;
  if(loadingTests)return;
  loadingTests=true;

  // Show cached data immediately
  const hadCache=loadFromCache();
  if(hadCache){
    setStatus('Loading... (cached)');
    renderMatrix();
  } else {
    setStatus('Loading test data...');
    testsData[currentProject]={};
    // Init empty module entries
    proj().modules.forEach(m=>{testsData[currentProject][m]={};});
    renderMatrix();
  }

  // Background refresh from OneDrive
  try{
    const projFolder=await ensureFolder(rootFolderId,proj().folder);
    // Search ALL json files under project folder recursively
    const searchRes=await graphRequest(
      `/me/drive/items/${projFolder.id}/search(q='.json')?$select=id,name,parentReference&$top=200`
    );
    const files=(searchRes.value||[]).filter(f=>
      f.name&&f.name.endsWith('.json')&&
      !f.name.startsWith('_')&&
      !f.parentReference?.path?.includes('_Deleted')
    );

    // Reset and re-populate
    const fresh={};
    proj().modules.forEach(m=>{fresh[m]={};});

    for(const file of files){
      try{
        const text=await graphRequest(`/me/drive/items/${file.id}/content`);
        const data=JSON.parse(typeof text==='string'?text:JSON.stringify(text));
        const mod=data.module;
        const tk=data.test_type;
        if(!mod||!tk||!fresh[mod])continue;
        const sysNo=data.system_no||'';
        const key=tk+'|'+sysNo;
        fresh[mod][key]={fileId:file.id,fileName:file.name,data};
      }catch(e){console.warn('Could not load',file.name,e);}
    }

    testsData[currentProject]=fresh;
    saveToCache();
    setStatus('Loaded ✓');
    renderMatrix();
  }catch(e){
    setStatus(hadCache?'Using cached data (offline?)':'Load error: '+e.message);
    console.error(e);
  }
  loadingTests=false;
}

// ========== OVERVIEW MATRIX ==========
function renderMatrix(){
  const wrap=document.getElementById('matrix-wrap');
  const mods=proj().modules;
  const tks=Object.keys(TEST_TYPES);
  const pd=testsData[currentProject]||{};

  let html=`<table class="matrix-table">
    <thead><tr>
      <th class="mod-col">Module</th>`;
  const shortNames={
    'QC-4.0':'Underfloor\nHeating',
    'QC-4.1':'Radiator\nHeating',
    'QC-4.2':'Sewer\nHydraulic',
    'QC-5.0':'Water\nConcealed Wall',
    'QC-5.1':'Water\nCollector',
    'QC-5.2':'Water\nFull System'
  };
  for(const tk of tks){
    const sub=(shortNames[tk]||'').replace('\\n','<br>');
    html+=`<th>${tk}<br><span style="font-weight:400;font-size:10px;opacity:0.85">${sub}</span></th>`;
  }
  html+=`</tr></thead><tbody>`;

  for(const mod of mods){
    html+=`<tr><td class="mod-name">${mod}</td>`;
    for(const tk of tks){
      const modData=pd[mod]||{};
      // Collect all entries for this testType (any system_no)
      const entries=Object.entries(modData).filter(([k])=>k===tk+'|'||(k.startsWith(tk+'|')));
      if(!msConnected){
        html+=`<td class="cell-empty">—</td>`;
      } else {
        // Check if N/A (key tk+'|')
        const naEntry=modData[tk+'|N/A'];
        const realEntries=entries.filter(([k,v])=>v&&v.data&&v.data.result!=='N/A');
        const hasNA=entries.some(([k,v])=>v&&v.data&&v.data.result==='N/A');
        if(hasNA&&realEntries.length===0){
          if(isAdmin()){
            html+=`<td class="cell-na-set" onclick="clearNA('${mod}','${tk}')" title="Click to remove N/A">N/A ✕</td>`;
          } else {
            html+=`<td class="cell-na-set" title="Not applicable">N/A</td>`;
          }
        } else if(realEntries.length>0){
          let inner='';
          for(const [key,entry] of realEntries){
            const d=entry.data;
            const dateStr=d.date||'';
            const res=d.result||'';
            const color=res==='Passed'?'#2e7d32':res==='Failed'?'#c62828':res==='Pending'?'#e65100':'#999';
            const sysNo=d.system_no?`<span style="font-size:10px;color:#888">${d.system_no}</span><br>`:'';
            const sysNoEnc=encodeURIComponent(d.system_no||'');
            inner+=`<div class="cell-done" onclick="openTestByKey('${mod}','${key}')" style="color:${color};border-bottom:1px solid #eee;padding:2px 0" title="Click to view/edit">${sysNo}${dateStr}<br><span style="font-size:10px">${res}</span></div>`;
          }
          inner+=`<div style="padding-top:3px"><button class="cell-btn" onclick="startTest('${mod}','${tk}')" style="font-size:10px;padding:2px 6px">+ Add</button></div>`;
          html+=`<td style="padding:4px">${inner}</td>`;
        } else {
          const naBtn=isAdmin()?`<button class="cell-btn-na" onclick="setNA('${mod}','${tk}')">N/A</button>`:'';
          html+=`<td style="white-space:nowrap">
            <button class="cell-btn" onclick="startTest('${mod}','${tk}')">+ Add</button>${naBtn}
          </td>`;
        }
      }
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table>`;
  html+=`<p style="font-size:11px;color:#999;margin-top:8px;">Click any date cell to view or edit. "+ Add" to record a new test. "N/A" if test is not applicable.</p>`;
  wrap.innerHTML=html;
}

// ========== N/A FUNCTIONS ==========
async function setNA(mod,tk){
  if(!msConnected){alert('Connect OneDrive first.');return;}
  if(!confirm(`Mark ${mod} — ${tk} as N/A?`))return;
  const data={test_type:tk,project:currentProject,module:mod,result:'N/A',date:todayISO(),saved_at:new Date().toISOString()};
  try{
    const folder=await getModuleHVACFolder(mod,tk);
    const fname=`${mod.replace(/[ -]/g,'')}_${tk}_NA.json`;
    const res=await graphRequest(`/me/drive/items/${folder.id}:/${fname}:/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!testsData[currentProject])testsData[currentProject]={};
    if(!testsData[currentProject][mod])testsData[currentProject][mod]={};
    const naKey=tk+'|N/A';
    testsData[currentProject][mod][naKey]={fileId:res.id,fileName:fname,data};
    saveToCache();
    setStatus('Marked as N/A ✓');
    renderMatrix();
  }catch(e){setStatus('Error: '+e.message);}
}

async function clearNA(mod,tk){
  if(!confirm(`Remove N/A for ${mod} — ${tk}?`))return;
  try{
    const naKey=tk+'|N/A';
    const entry=(testsData[currentProject]||{})[mod]?.[naKey];
    if(entry?.fileId){
      await graphRequest(`/me/drive/items/${entry.fileId}`,{method:'DELETE'});
    }
    delete testsData[currentProject][mod][naKey];
    saveToCache();
    setStatus('N/A removed ✓');
    renderMatrix();
  }catch(e){setStatus('Error: '+e.message);}
}

document.getElementById('camera-input').onchange=handlePhotoInput;
document.getElementById('photo-input').onchange=handlePhotoInput;

async function handlePhotoInput(e){
  const file=e.target.files[0];
  if(!file||!currentPhotoSlot)return;
  e.target.value='';
  if(!msConnected){alert('Connect OneDrive first.');return;}
  // Show preview immediately
  const reader=new FileReader();
  reader.onload=ev=>{
    const slot=document.getElementById('slot-'+currentPhotoSlot);
    const label=slot?.querySelector('.photo-label')?.textContent||currentPhotoSlot;
    if(slot){
      slot.innerHTML=`<img src="${ev.target.result}" alt="photo"/>
        <div class="photo-label-overlay">${label}</div>
        <div class="uploading-overlay" id="upl-${currentPhotoSlot}">Uploading...</div>`;
    }
  };
  reader.readAsDataURL(file);
  // Auto-set time from photo upload moment
  const now=new Date();
  const timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const slotTimeMap={
    'ph-p1-start':'f-p1-ts','ph-p1-end':'f-p1-te',
    'ph-p2-start':'f-p2-ts','ph-p2-end':'f-p2-te',
    'ph-sewer-start':'f-start-time','ph-sewer-end':'f-end-time',
    'ph-hot-start':'f-start-time','ph-hot-end':'f-end-time',
    'ph-cold-start':'f-start-time','ph-cold-end':'f-end-time'
  };
  const timeFieldId=slotTimeMap[currentPhotoSlot];
  if(timeFieldId){
    const tf=document.getElementById(timeFieldId);
    if(tf&&!tf.value)tf.value=timeStr; // only set if empty
  }
  // Upload
  try{
    const folder=await getModuleHVACFolder(currentTestCtx.module,currentTestCtx.testType);
    const fname=`${currentTestCtx.module.replace(/[ -]/g,'')}_${currentPhotoSlot}_${Date.now()}.jpg`.replace(/\s/g,'_');
    const buf=await file.arrayBuffer();
    const res=await fetch(`${GRAPH_BASE}/me/drive/items/${folder.id}:/${fname}:/content`,{
      method:'PUT',
      headers:{Authorization:`Bearer ${await ensureToken()}`,'Content-Type':'image/jpeg'},
      body:buf
    });
    const data=await res.json();
    const driveId=data.id;
    // Store in context
    storePhotoId(currentPhotoSlot,driveId);
    // Remove uploading overlay
    const slot=document.getElementById('slot-'+currentPhotoSlot);
    const upl=document.getElementById('upl-'+currentPhotoSlot);
    if(upl)upl.style.display='none';
    if(slot){slot.setAttribute('data-drive-id',driveId);slot.onclick=null;}
    // Auto-save so photo IDs are never lost
    const autoData=collectFormData();
    await _saveData(autoData);
    setStatus('Photo saved ✓');
    updateDiffs();
  }catch(err){setStatus('Photo upload error: '+err.message);}
}

function storePhotoId(slotId,driveId){
  if(!currentTestCtx.data)currentTestCtx.data={};
  const d=currentTestCtx.data;

  if(t==='QC-4.0'||t==='QC-4.1'){
    if(slotId==='ph-p1-start'){if(!d.part_i)d.part_i={};d.part_i.start_photo_id=driveId;}
    if(slotId==='ph-p1-end'){if(!d.part_i)d.part_i={};d.part_i.end_photo_id=driveId;}
    if(slotId==='ph-p2-start'){if(!d.part_ii)d.part_ii={};d.part_ii.start_photo_id=driveId;}
    if(slotId==='ph-p2-end'){if(!d.part_ii)d.part_ii={};d.part_ii.end_photo_id=driveId;}
  }
  if(t==='QC-4.2'){
    if(slotId==='ph-sewer-start')d.start_photo_id=driveId;
    if(slotId==='ph-sewer-end')d.end_photo_id=driveId;
    if(slotId==='ph-sewer-overview')d.overview_photo_id=driveId;
  }

async function removePhoto(e,slotId,driveId){
  e.stopPropagation();
  if(!confirm('Remove this photo?'))return;
  // Restore empty slot
  const slot=document.getElementById('slot-'+slotId);
  const labelMap={'ph-p1-start':'Part I — Start','ph-p1-end':'Part I — End','ph-p2-start':'Part II — Start','ph-p2-end':'Part II — End','ph-sewer-start':'Start','ph-sewer-end':'End','ph-sewer-overview':'Overview','ph-hot-start':'HOT — Start','ph-hot-end':'HOT — End','ph-cold-start':'COLD — Start','ph-cold-end':'COLD — End'};

// ========== DIFF CALCULATION ==========
function updateDiffs(){
  const t=currentTestCtx?.testType;
  if(!t)return;

  if(t==='QC-4.0'||t==='QC-4.1'){
    const p1s=parseFloat(document.getElementById('f-p1-ps')?.value);
    const p1e=parseFloat(document.getElementById('f-p1-pe')?.value);
    const p2s=parseFloat(document.getElementById('f-p2-ps')?.value);
    const p2e=parseFloat(document.getElementById('f-p2-pe')?.value);
    const d1=isNaN(p1s)||isNaN(p1e)?null:+(p1e-p1s).toFixed(2);
    const d2=isNaN(p2s)||isNaN(p2e)?null:+(p2e-p2s).toFixed(2);
    setDiffCell('diff-p1',d1,0);
    setDiffCell('diff-p2',d2,0);
    const passed=d1!==null&&d2!==null&&d1===0&&d2===0;
    const failed=d1!==null&&d2!==null&&(d1!==0||d2!==0);
    setResult(passed,failed);
  }
  if(t==='QC-4.2'){
    const ws=parseFloat(document.getElementById('f-wl-start')?.value);
    const we=parseFloat(document.getElementById('f-wl-end')?.value);
    const diff=isNaN(ws)||isNaN(we)?null:+(we-ws).toFixed(1);
    setDiffCell('diff-wl',diff,1,'mm');
    const passed=diff!==null&&Math.abs(diff)<=1;
    const failed=diff!==null&&Math.abs(diff)>1;
    setResult(passed,failed);
  }
  if(t==='QC-5.0'){
    const hs=parseFloat(document.getElementById('f-hot-ps')?.value);
    const he=parseFloat(document.getElementById('f-hot-pe')?.value);
    const cs=parseFloat(document.getElementById('f-cold-ps')?.value);
    const ce=parseFloat(document.getElementById('f-cold-pe')?.value);
    const dh=isNaN(hs)||isNaN(he)?null:+(he-hs).toFixed(2);
    const dc=isNaN(cs)||isNaN(ce)?null:+(ce-cs).toFixed(2);
    setDiffCell('diff-hot',dh,0);
    setDiffCell('diff-cold',dc,0);
    const passed=dh!==null&&dc!==null&&dh===0&&dc===0;
    const failed=dh!==null&&dc!==null&&(dh!==0||dc!==0);
    setResult(passed,failed);
  }
}

function setDiffCell(id,val,tolerance,unit='bar'){
  const el=document.getElementById(id);
  if(!el)return;
  if(val===null){el.textContent='—';el.className='diff-cell';return;}
  const ok=Math.abs(val)<=tolerance;
  el.textContent=`${val} ${unit}`;
  el.className='diff-cell'+(ok?'':' fail');
}

function setResult(passed,failed){
  const bar=document.getElementById('result-bar');
  const lbl=document.getElementById('result-label');
  if(!bar||!lbl)return;
  if(currentTestCtx?.data?.result==='Pending'){bar.className='result-bar pending';lbl.textContent='PENDING';return;}
  if(passed){bar.className='result-bar passed';lbl.textContent='PASSED';}
  else if(failed){bar.className='result-bar failed';lbl.textContent='FAILED';}
  else{bar.className='result-bar pending';lbl.textContent='—';}
}

// ========== COLLECT FORM DATA ==========
function collectFormData(){
  const t=currentTestCtx.testType;
  const existing=currentTestCtx.data||{};
  const base={
    test_type:t,
    project:currentProject,
    module:currentTestCtx.module,
    date:document.getElementById('f-date')?.value||todayISO(),
    performed_by:document.getElementById('f-performer')?.value||'',
    qc_representative:QC_REP,
    notes:document.getElementById('f-notes')?.value||'',
    saved_at:new Date().toISOString()
  };

  if(t==='QC-4.0'||t==='QC-4.1'){
    const p1s=parseFloat(document.getElementById('f-p1-ps').value);
    const p1e=parseFloat(document.getElementById('f-p1-pe').value);
    const p2s=parseFloat(document.getElementById('f-p2-ps').value);
    const p2e=parseFloat(document.getElementById('f-p2-pe').value);
    const d1=isNaN(p1s)||isNaN(p1e)?null:+(p1e-p1s).toFixed(2);
    const d2=isNaN(p2s)||isNaN(p2e)?null:+(p2e-p2s).toFixed(2);
    base.system=document.getElementById('f-system')?.value||'';
    base.system_no=document.getElementById('f-sysno')?.value||'';
    base.visual_inspection=document.getElementById('f-vi')?.checked||false;
    base.part_i={start_time:document.getElementById('f-p1-ts').value,end_time:document.getElementById('f-p1-te').value,pressure_start:p1s,pressure_end:p1e,difference:d1,start_photo_id:existing.part_i?.start_photo_id||null,end_photo_id:existing.part_i?.end_photo_id||null};
    base.part_ii={start_time:document.getElementById('f-p2-ts').value,end_time:document.getElementById('f-p2-te').value,pressure_start:p2s,pressure_end:p2e,difference:d2,start_photo_id:existing.part_ii?.start_photo_id||null,end_photo_id:existing.part_ii?.end_photo_id||null};
    base.result=(d1!==null&&d2!==null&&d1===0&&d2===0)?'Passed':(d1!==null&&d2!==null?'Failed':'');
  }
  if(t==='QC-4.2'){
    const ws=parseFloat(document.getElementById('f-wl-start').value);
    const we=parseFloat(document.getElementById('f-wl-end').value);
    const diff=isNaN(ws)||isNaN(we)?null:+(we-ws).toFixed(1);
    base.system_no=document.getElementById('f-sysno')?.value||'';
    base.start_time=document.getElementById('f-start-time')?.value||'';
    base.end_time=document.getElementById('f-end-time')?.value||'';
    base.water_level_start=ws;base.water_level_end=we;base.difference=diff;
    base.start_photo_id=existing.start_photo_id||null;
    base.end_photo_id=existing.end_photo_id||null;
    base.overview_photo_id=existing.overview_photo_id||null;
    base.result=diff!==null?(Math.abs(diff)<=1?'Passed':'Failed'):'';
  }
  if(t==='QC-5.0'){
    const hs=parseFloat(document.getElementById('f-hot-ps').value);
    const he=parseFloat(document.getElementById('f-hot-pe').value);
    const cs=parseFloat(document.getElementById('f-cold-ps').value);
    const ce=parseFloat(document.getElementById('f-cold-pe').value);
    const dh=isNaN(hs)||isNaN(he)?null:+(he-hs).toFixed(2);
    const dc=isNaN(cs)||isNaN(ce)?null:+(ce-cs).toFixed(2);
    base.system_scope=document.getElementById('f-scope')?.value||'';
    base.system_no=document.getElementById('f-sysno')?.value||'';
    base.start_time=document.getElementById('f-start-time')?.value||'';
    base.end_time=document.getElementById('f-end-time')?.value||'';
    base.hot={pressure_start:hs,pressure_end:he,difference:dh,start_photo_id:existing.hot?.start_photo_id||null,end_photo_id:existing.hot?.end_photo_id||null};
    base.cold={pressure_start:cs,pressure_end:ce,difference:dc,start_photo_id:existing.cold?.start_photo_id||null,end_photo_id:existing.cold?.end_photo_id||null};
    base.result=(dh!==null&&dc!==null&&dh===0&&dc===0)?'Passed':(dh!==null&&dc!==null?'Failed':'');
  }
  return base;
}

async function deleteTest(){
  if(!currentTestCtx.fileId){showTab('overview');return;}
  if(!confirm('Move this test to _Deleted folder? Photos will also be moved.'))return;
  setStatus('Moving to _Deleted...');
  try{
    // Get test folder
    const testFolder=await getModuleHVACFolder(currentTestCtx.module,currentTestCtx.testType);
    // Create _Deleted subfolder inside test folder
    const delFolder=await ensureFolder(testFolder.id,'_Deleted');
    // Move JSON file
    await graphRequest(`/me/drive/items/${currentTestCtx.fileId}`,{
      method:'PATCH',
      body:JSON.stringify({parentReference:{id:delFolder.id}})
    });
    // Move all photos referenced in test data
    const d=currentTestCtx.data||{};
    const photoIds=collectPhotoIds(d);
    for(const pid of photoIds){
      if(!pid)continue;
      try{
        await graphRequest(`/me/drive/items/${pid}`,{
          method:'PATCH',
          body:JSON.stringify({parentReference:{id:delFolder.id}})
        });
      }catch(e){console.warn('Could not move photo',pid,e);}
    }
    // Clear from state
    const key=currentTestCtx.testType+'|'+(currentTestCtx.data?.system_no||'');
    if(testsData[currentProject]?.[currentTestCtx.module]){
      delete testsData[currentProject][currentTestCtx.module][key];
    }
    clearCache();
    setStatus('Moved to _Deleted ✓');
    showTab('overview');
    renderMatrix();
  }catch(e){setStatus('Delete error: '+e.message);console.error(e);}
}

function collectPhotoIds(d){
  const ids=[];
  if(d.part_i){ids.push(d.part_i.start_photo_id,d.part_i.end_photo_id);}
  if(d.part_ii){ids.push(d.part_ii.start_photo_id,d.part_ii.end_photo_id);}
  if(d.hot){ids.push(d.hot.start_photo_id,d.hot.end_photo_id);}
  if(d.cold){ids.push(d.cold.start_photo_id,d.cold.end_photo_id);}
  ids.push(d.start_photo_id,d.end_photo_id,d.overview_photo_id);
  return ids.filter(Boolean);
}

async function _saveData(data){
  try{
    const folder=await getModuleHVACFolder(currentTestCtx.module,currentTestCtx.testType);
    const mod=currentTestCtx.module.replace(/[ -]/g,'');
    const dateStr=(data.date||todayISO()).replace(/-/g,'');
    const sysNo=data.system_no?'_'+data.system_no.replace(/\s/g,''):'';
    const fname=`${mod}_${currentTestCtx.testType}${sysNo}_${dateStr}.json`;
    const body=JSON.stringify(data,null,2);
    let fileId=currentTestCtx.fileId;
    if(fileId){
      await graphRequest(`/me/drive/items/${fileId}/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body});
    } else {
      const res=await graphRequest(`/me/drive/items/${folder.id}:/${fname}:/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body});
      fileId=res.id;
      currentTestCtx.fileId=fileId;
      currentTestCtx.fileName=fname;
    }
    currentTestCtx.data=data;
    if(!testsData[currentProject])testsData[currentProject]={};
    if(!testsData[currentProject][currentTestCtx.module])testsData[currentProject][currentTestCtx.module]={};
    const sKey=currentTestCtx.testType+'|'+(data.system_no||'');
    currentTestCtx.stateKey=sKey;
    testsData[currentProject][currentTestCtx.module][sKey]={fileId,fileName:fname,data};
    saveToCache();
    setStatus('Saved ✓ '+new Date().toLocaleTimeString());
    renderMatrix();
  }catch(e){setStatus('Save error: '+e.message);console.error(e);}
}

async function getImageBase64(driveId){
  if(!driveId)return null;
  try{
    const token=await ensureToken();
    // Get download URL via thumbnail (large)
    const res=await fetch(`${GRAPH_BASE}/me/drive/items/${driveId}/content`,{
      headers:{Authorization:`Bearer ${token}`}
    });
    if(!res.ok)return null;
    const blob=await res.blob();
    return new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=e=>resolve(e.target.result);
      reader.onerror=()=>resolve(null);
      reader.readAsDataURL(blob);
    });
  }catch(e){console.warn('Image load error',driveId,e);return null;}
}

    <table class="mtbl" style="margin-top:8px">

      <tr><td class="rl" style="color:#c62828">● HOT</td><td>${data.hot?.pressure_start??'—'} bar</td><td>${data.hot?.pressure_end??'—'} bar</td><td class="diff">${data.hot?.difference??'—'} bar</td></tr>
      <tr class="alt"><td class="rl" style="color:#1565c0">● COLD</td><td>${data.cold?.pressure_start??'—'} bar</td><td>${data.cold?.pressure_end??'—'} bar</td><td class="diff">${data.cold?.difference??'—'} bar</td></tr>
    </table>`;
  }

  // ── Photo annexes (each on own page) ──────────────────────────────────────
  const annexHtml=loadedPhotos.filter(p=>p.src).map(p=>`
    <div class="annex-page">
      <div class="annex-header">${p.label}</div>
      <div class="annex-sub">${tt.label} · ${data.module} · ${data.date}</div>
      <img src="${p.src}" class="annex-img" alt="${p.label}"/>
    </div>`).join('');

  // ── Full HTML ──────────────────────────────────────────────────────────────
  const docHtml=`<!DOCTYPE html><html><head><meta charset="UTF-8"/>
  <title>${pdfName}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',Arial,sans-serif;font-size:11.5px;color:#1a1a1a;}
    .page1{padding:28px 32px 28px;}
    /* Header */
    .doc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
    .doc-title h1{font-size:17px;font-weight:800;color:#1a3a2a;line-height:1.2;margin-bottom:3px;}
    .doc-title h2{font-size:11px;color:#555;font-weight:400;}
    .doc-title .scope-tag{display:inline-block;margin-top:5px;background:#e8f5ec;color:#1a3a2a;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid #b2dfdb;}
    .logo{height:48px;width:auto;}
    /* Divider */
    .divider{border:none;border-top:2px solid #2d5a3d;margin:10px 0 14px;}
    /* Sections */
    .section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#2d5a3d;border-bottom:1.5px solid #2d5a3d;padding-bottom:3px;margin:14px 0 8px;}
    .note{font-size:10px;color:#666;font-style:italic;margin-bottom:6px;}
    /* Rows */
    .row{display:flex;margin-bottom:4px;align-items:baseline;}
    .lbl{width:180px;color:#666;font-size:11px;}
    .val{font-weight:600;font-size:11px;}
    /* Table */
    .mtbl{border-collapse:collapse;width:100%;margin-bottom:4px;}
    .mtbl td,.mtbl th{padding:5px 8px;border:1px solid #ddd;text-align:center;font-size:11px;}
    .mtbl .th th{background:#1a3a2a;color:#fff;font-weight:600;}
    .mtbl .rl{text-align:left;font-weight:700;background:#f8fdf9;}
    .mtbl .alt td{background:#fafafa;}
    .diff{font-weight:700;color:#1a3a2a;}
    /* Personnel */
    .personnel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
    .person-card{background:#f8fdf9;border:1px solid #ddd;border-radius:6px;padding:8px 12px;}
    .person-role{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:#888;margin-bottom:2px;}
    .person-name{font-size:12px;font-weight:700;color:#1a3a2a;}
    /* Result */
    .result-block{display:flex;align-items:center;gap:16px;margin-top:14px;padding:14px 18px;border-radius:8px;background:${resBg};border:2px solid ${resBorder};}
    .result-icon{font-size:32px;color:${resColor};}
    .result-text .result-word{font-size:22px;font-weight:800;color:${resColor};letter-spacing:1px;}
    .result-text .result-label{font-size:10px;color:#888;margin-top:1px;}
    /* Signature */
    .sig-line{border-top:1px solid #999;width:220px;margin-top:28px;margin-bottom:3px;}
    .sig-label{font-size:9px;color:#888;}
    /* Footer */
    .footer{margin-top:20px;padding-top:8px;border-top:1px solid #eee;font-size:9px;color:#aaa;display:flex;justify-content:space-between;}
    /* Annex pages */
    .annex-page{page-break-before:always;padding:28px 32px;}
    .annex-header{font-size:15px;font-weight:700;color:#1a3a2a;margin-bottom:4px;}
    .annex-sub{font-size:10px;color:#888;margin-bottom:14px;}
    .annex-img{max-width:100%;max-height:220mm;object-fit:contain;border-radius:4px;border:1px solid #eee;}
    @media print{
      @page{margin:0;}
      body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    }
  </style>
  </head><body>
  <div class="page1">
    <div class="doc-header">
      <div class="doc-title">
        <h1>${tt.label.toUpperCase()}</h1>
        <h2>Nordic Homes — Quality Control Protocol</h2>
        ${data.system_scope?`<span class="scope-tag">${data.system_scope}${data.system_no&&data.system_no!=='N/A'?' · '+data.system_no:''}</span>`:''}
      </div>
      <img class="logo" src="https://drive.google.com/uc?export=view&id=1QAHFh_OvZyUbqaZIHgVCSaA07kihC6Kz" alt="Nordic Homes" onerror="this.style.display='none'"/>
    </div>
    <hr class="divider"/>

    <div class="section">1. Basic Information</div>
    <div class="row"><span class="lbl">Project</span><span class="val">${proj().label}</span></div>
    <div class="row"><span class="lbl">Module No.</span><span class="val">${data.module}</span></div>
    <div class="row"><span class="lbl">Date</span><span class="val">${(data.date||'').split('-').reverse().join('.')}</span></div>
    ${data.system?`<div class="row"><span class="lbl">System</span><span class="val">${data.system}</span></div>`:''}

    ${measHtml}

    <div class="section">3. Personnel</div>
    <div class="personnel-grid">
      <div class="person-card"><div class="person-role">Performed by</div><div class="person-name">${data.performed_by||'—'}</div></div>
      <div class="person-card"><div class="person-role">QC Representative</div><div class="person-name">${data.qc_representative}</div></div>
    </div>
    <div class="sig-line"></div>
    <div class="sig-label">QC Representative signature</div>

    ${data.notes?`<div class="section">Notes</div><p style="font-size:11px;color:#333">${data.notes}</p>`:''}

    <div class="result-block">
      <div class="result-icon">${resIcon}</div>
      <div class="result-text">
        <div class="result-word">${res||'—'}</div>
        <div class="result-label">Test result — ${tt.label}</div>
      </div>
    </div>

    <div class="footer">
      <span>Nordic Homes — ${tt.label}</span>
      <span>${pdfName}</span>
    </div>
  </div>
  ${annexHtml}
  </body></html>`;

  // ── Open + trigger print with suggested filename ───────────────────────────
  const win=window.open('','_blank');
  win.document.write(docHtml);
  win.document.close();
  win.focus();
  // Set title so browser uses it as default save name
  win.document.title=pdfName;
  setTimeout(()=>win.print(),800);
}
</script>
</body>
</html>
